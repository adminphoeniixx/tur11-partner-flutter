name: turf11_owner_panel
description: Turf11 Partner Flutter App
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  change_app_package_name: ^1.5.0
  dio: ^5.7.0
  firebase_core: ^2.30.0
  geocoding: ^3.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  package_info_plus: ^8.1.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.1


flutter_launcher_icons:
  android: true
  ios: true

  # Your App Icon Path
  image_path: "assets/images/turf11_partner_logo.png"

  # IMPORTANT → Removes Alpha Channel For iOS
  remove_alpha_ios: true

  # Optional
  adaptive_icon_background: "#FFFFFF"


flutter:
  uses-material-design: true
  assets:
    - assets/images/turf11_partner_logo.png
